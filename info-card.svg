<style>

text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

.line {
    opacity: 0;
    animation: show 0.40s ease forwards;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateX(-8px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.cursor {
    animation: blink 1s steps(2,start) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

</style>

