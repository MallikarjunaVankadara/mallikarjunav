name: Update Profile Art

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  build-profile:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build contribution data
        run: |
          python scripts/fetch_contributions.py

      - name: Build contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Build info card
        run: |
          python scripts/make_info_card.py

      - name: Build ASCII portrait
        run: |
          python scripts/prep_photo.py
          python scripts/make_ascii_svg.py

      - name: Commit generated profile artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json
          git add contrib-heatmap.svg
          git add info-card.svg
          git add mallikarjuna-ascii.svg
          git add profile-prepped.png

          git diff --cached --quiet || git commit -m "chore: refresh profile art [skip ci]"
          git push